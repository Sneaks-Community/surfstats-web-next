name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Lint, Test, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high vulnerabilities)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Provide dummy env vars so the build doesn't fail if it requires them at build time
          STEAM_API_KEY: dummy_key
          SERVERS_JSON: '[]'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref != 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image (production stage)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          target: production
          tags: surfstats-web-next:test
          cache-from: type=gha
          cache-to: type=gha,mode=max